# CI för ditt testrepo (GitHub Actions). Körs vid varje push och pull request. 
# Lektion 3: komponenttester och GUI-tester. Lektion 4: API-tester. 
name: CI 
 
on: 
  push: 
  pull_request: 
  workflow_dispatch: 
 
jobs: 
  tester: 
    runs-on: ubuntu-latest 
    timeout-minutes: 15 
    steps: 
      - name: Hämta koden 
        uses: actions/checkout@v7 
        with: 
          fetch-depth: 0 
 
      - name: Installera uv och Python 
        uses: astral-sh/setup-uv@v10.3.0 
        with: 
          version: "0.13.4" 
          python-version: "3.12" 
          enable-cache: true 
 
      - name: Installera paketen 
        run: uv sync --locked 
 
      - name: Komponenttester 
        run: uv run pytest tests/unit -v 
 
      - name: Installera Chromium 
        run: uv run playwright install --with-deps chromium 
 
      - name: Starta butiken 
        run: uv run python scripts/shop.py start 
 
      - name: API-tester 
        run: uv run pytest tests/api -v 
 
      - name: GUI-tester 
        run: uv run pytest tests/gui -v --tracing retain-on-failure 
 
      - name: Spara testresultat 
        if: always() 
        uses: actions/upload-artifact@v7 
        with: 
          name: testresultat 
          path: test-results/ 
          if-no-files-found: ignore 
